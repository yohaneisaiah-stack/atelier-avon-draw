function drawStroke(s){drawStrokeOn(ctx,s)}
function renderIncremental(s){const p=strokePoints(s);if(p.length<2)return;if(s.rendered===0){drawLine(ctx,p[0],midpoint(p[0],p[1]),s.mode);s.rendered=1}while(s.rendered<p.length-1){const i=s.rendered;drawCurve(ctx,midpoint(p[i-1],p[i]),p[i],midpoint(p[i],p[i+1]),s.mode);s.rendered++}}
function finishIncremental(s){const p=strokePoints(s);if(isTapStroke(s)){drawDot(ctx,p[0],s.mode,true);return}renderIncremental(s);if(p.length>1){drawCurve(ctx,midpoint(p[p.length-2],p[p.length-1]),p[p.length-1],p[p.length-1],s.mode);drawDot(ctx,p[p.length-1],s.mode)}}
function renderAll(){const r=canvas.getBoundingClientRect();ctx.save();ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);ctx.restore();commands.forEach(drawStroke);if(current)drawStroke(current);updateHistoryButtons()}
const preferStylusTouch=(()=>{try{return typeof Touch!=='undefined'&&'touchType'in Touch.prototype}catch{return false}})();
function acceptPointer(e){if(paused)return false;if(e.pointerType==='pen'){if(preferStylusTouch)return false;lastPenAt=performance.now();return true}if(e.pointerType==='touch')return false;if(e.pointerType==='mouse')return e.button===0;return false}
function eventBatch(e){try{const list=e.getCoalescedEvents?e.getCoalescedEvents():null;return list&&list.length?list:[e]}catch{return[e]}}
function stylusTouch(list,id=null){for(let i=0;i<list.length;i++){const touch=list[i];if(touch.touchType==='stylus'&&(id===null||touch.identifier===id))return touch}return null}
function touchAsPointer(touch,e){return{clientX:touch.clientX,clientY:touch.clientY,pressure:Number.isFinite(touch.force)?touch.force:.5,pointerType:'pen',timeStamp:e.timeStamp}}
function beginStroke(e){current={mode,points:[],rendered:0,widthState:null,alphaState:null,rawLast:null,smoothLast:null,tail:null};const q=eventPoint(e,current);current.rawLast=q;current.smoothLast=q;current.tail=q;current.points.push(q);drawDot(ctx,q,current.mode)}
function appendEvent(e){if(!current)return;const q=eventPoint(e,current),raw=current.rawLast,smooth=current.smoothLast,dt=Math.max(1,q.t-raw.t),speed=Math.hypot(q.x-raw.x,q.y-raw.y)/dt,follow=clamp(.42+speed*.28,.42,.92),x=smooth.x+(q.x-smooth.x)*follow,y=smooth.y+(q.y-smooth.y)*follow,anchor=current.tail,dist=Math.hypot(x-anchor.x,y-anchor.y),next=dynamicPoint(current,x,y,q.bw,q.ba,q.t,anchor.d+dist,speed),steps=Math.floor(dist/RESAMPLE_SPACING);for(let i=1;i<=steps;i++){const f=i*RESAMPLE_SPACING/dist,d=anchor.d+i*RESAMPLE_SPACING,bw=anchor.bw+(next.bw-anchor.bw)*f,ba=anchor.ba+(next.ba-anchor.ba)*f,p=dynamicPoint(current,anchor.x+(next.x-anchor.x)*f,anchor.y+(next.y-anchor.y)*f,bw,ba,next.t,d,speed);current.points.push(p);current.tail=p}if(current.curvePoints){const curveLast=current.curvePoints[current.curvePoints.length-1],curveDist=Math.hypot(next.x-curveLast.x,next.y-curveLast.y);if(curveDist>=.35)current.curvePoints.push({...next,d:curveLast.d+curveDist})}current.rawLast=q;current.smoothLast=next;renderIncremental(current)}
function appendEndpoint(){if(!current||!current.smoothLast)return;const a=current.tail,b=current.smoothLast,dist=Math.hypot(b.x-a.x,b.y-a.y);if(dist>.15){const p=dynamicPoint(current,b.x,b.y,b.bw,b.ba,b.t,a.d+dist,b.v||0);if(current.mode==='pen'&&p.d>=8){const preset=BRUSH_PRESETS.croquisPencil,endScale=clamp(preset.endScale-(b.v||0)*preset.endVelocityInfluence,preset.endScaleMin,preset.endScale);p.w*=endScale;p.a*=preset.endOpacityScale}current.points.push(p);current.tail=p;if(current.curvePoints){const curveLast=current.curvePoints[current.curvePoints.length-1];if(Math.hypot(p.x-curveLast.x,p.y-curveLast.y)>.15)current.curvePoints.push(p)}}renderIncremental(current)}
function clearPrediction(){const r=predictionCanvas.getBoundingClientRect();predictionCtx.clearRect(0,0,r.width,r.height)}
function renderPredictions(e){clearPrediction();if(!current||e.pointerType!=='pen'||typeof e.getPredictedEvents!=='function')return;let list;try{list=e.getPredictedEvents()}catch{return}if(!list||!list.length)return;const points=[current.smoothLast||current.tail];let prev=points[0];for(const ev of list.slice(0,8)){const q=eventPoint(ev,current,false);if(Math.hypot(q.x-prev.x,q.y-prev.y)>48)break;points.push(q);prev=q}if(points.length>1)drawStrokeOn(predictionCtx,{mode:current.mode,points})}
canvas.addEventListener('pointerdown',e=>{if(!acceptPointer(e))return;e.preventDefault();if(drawing)finalizeCurrent();drawing=true;activePointer=e.pointerId;try{canvas.setPointerCapture(e.pointerId)}catch{}beginStroke(e)},{passive:false});
canvas.addEventListener('pointermove',e=>{if(!drawing||e.pointerId!==activePointer||!current)return;e.preventDefault();clearPrediction();for(const ev of eventBatch(e))appendEvent(ev);renderPredictions(e)},{passive:false});
function appendFinalEvents(e){if(!current||!e)return;for(const ev of eventBatch(e))appendEvent(ev)}
function finalizeCurrent(){if(!drawing||!current)return;appendEndpoint();finishIncremental(current);commands.push(current);redoStack=[];drawing=false;activePointer=null;current=null;clearPrediction();updateHistoryButtons()}
canvas.addEventListener('pointerup',e=>{if(e.pointerId!==activePointer)return;e.preventDefault();appendFinalEvents(e);finalizeCurrent()},{passive:false});canvas.addEventListener('pointercancel',e=>{if(e.pointerId===activePointer)finalizeCurrent()},{passive:false});
canvas.addEventListener('touchstart',e=>{if(!preferStylusTouch||paused)return;const touch=stylusTouch(e.changedTouches);if(!touch)return;e.preventDefault();if(drawing)finalizeCurrent();drawing=true;activePointer=`touch-${touch.identifier}`;lastPenAt=performance.now();beginStroke(touchAsPointer(touch,e));current.curvePoints=[current.points[0]]},{passive:false});
canvas.addEventListener('touchmove',e=>{if(!preferStylusTouch||typeof activePointer!=='string'||!activePointer.startsWith('touch-')||!current)return;const id=Number(activePointer.slice(6)),touch=stylusTouch(e.changedTouches,id)||stylusTouch(e.touches,id);if(!touch)return;e.preventDefault();clearPrediction();appendEvent(touchAsPointer(touch,e))},{passive:false});
canvas.addEventListener('touchend',e=>{if(!preferStylusTouch||typeof activePointer!=='string'||!activePointer.startsWith('touch-'))return;const id=Number(activePointer.slice(6)),touch=stylusTouch(e.changedTouches,id);if(!touch)return;e.preventDefault();appendFinalEvents(touchAsPointer(touch,e));finalizeCurrent()},{passive:false});
canvas.addEventListener('touchcancel',e=>{if(preferStylusTouch&&typeof activePointer==='string'&&activePointer.startsWith('touch-'))finalizeCurrent()},{passive:false});
function updateHistoryButtons(){$('undo').disabled=!commands.length;$('redo').disabled=!redoStack.length}
$('pen').onclick=()=>setMode('pen');$('eraser').onclick=()=>setMode('eraser');function setMode(m){mode=m;$('pen').classList.toggle('on',m==='pen');$('eraser').classList.toggle('on',m==='eraser')}
$('undo').onclick=()=>{if(commands.length){redoStack.push(commands.pop());renderAll()}};$('redo').onclick=()=>{if(redoStack.length){commands.push(redoStack.pop());renderAll()}};$('clear').onclick=()=>{if(commands.length){commands.push({mode:'clear',points:[],before:commands.splice(0)});redoStack=[];renderAll()}};
// Clear commands store previous strokes as one undoable action.
const originalDrawStroke=drawStroke;drawStroke=function(s){if(s.mode!=='clear')originalDrawStroke(s)};
const originalUndo=$('undo').onclick;$('undo').onclick=()=>{if(!commands.length)return;const c=commands.pop();if(c.mode==='clear'){redoStack.push(c);commands.push(...c.before)}else redoStack.push(c);renderAll()};
const originalRedo=$('redo').onclick;$('redo').onclick=()=>{if(!redoStack.length)return;const c=redoStack.pop();if(c.mode==='clear'){c.before=commands.splice(0);commands.push(c)}else commands.push(c);renderAll()};
['selectstart','contextmenu','dragstart'].forEach(type=>$('session').addEventListener(type,e=>e.preventDefault()));document.addEventListener('gesturestart',e=>{if($('session').classList.contains('active'))e.preventDefault()},{passive:false});
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
