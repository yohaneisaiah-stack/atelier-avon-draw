<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee">
<link rel="manifest" href="manifest.webmanifest">
<title>Atelier Avon Draw v0.2</title>
<style>
:root{--bg:#f5f3ee;--panel:#fff;--ink:#181818;--muted:#777;--line:#ddd8ce}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
button,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.screen{display:none;height:100%;padding:28px;align-items:center;justify-content:center}.active{display:flex!important}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;max-width:760px;width:100%;box-shadow:0 6px 24px #0000000a}.brand{font-size:14px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}h1{font-size:46px;line-height:1.05;margin:10px 0 24px}h2{font-size:30px;margin:0 0 22px}.primary{background:#181818;color:#fff;border:0;border-radius:18px;padding:20px 24px;font-weight:700;font-size:22px;width:100%}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}.choice{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}.choice label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}.choice select{width:100%;border:0;background:transparent;font-weight:600}.note{color:var(--muted);font-size:14px;line-height:1.6;margin-top:16px}
#session{flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));gap:8px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}.topbar{min-height:52px;width:100%;display:flex;align-items:center;gap:8px}.counter{font-weight:700;min-width:62px}.timer{font-size:27px;font-weight:800;font-variant-numeric:tabular-nums;margin-left:auto}.sessionbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;white-space:nowrap;-webkit-user-select:none;user-select:none}.danger{color:#9c2929}.workspace{display:grid;grid-template-columns:minmax(220px,40%) minmax(0,60%);gap:8px;width:100%;flex:1;min-height:0}.reference,.drawpane{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative}.reference{display:flex;align-items:center;justify-content:center;padding:14px}.reference svg{width:100%;height:100%}.drawpane,canvas{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}canvas{width:100%;height:100%;display:block;background:#fff}.toolbar{position:absolute;bottom:12px;display:flex;gap:8px;background:#f5f3eeeb;backdrop-filter:blur(8px);padding:8px;border-radius:14px;border:1px solid var(--line)}.right-handed .toolbar{left:12px}.left-handed .toolbar{right:12px}.toolbtn{border:0;background:#fff;border-radius:10px;padding:10px 12px;min-width:48px;touch-action:manipulation}.toolbtn.on{background:#181818;color:#fff}.toolbtn:disabled{opacity:.35}
#result .thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}.thumb{aspect-ratio:1;background:#fafafa;border:1px solid var(--line);border-radius:10px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:contain}.actions{display:flex;gap:10px;flex-wrap:wrap}.modal{display:none;position:fixed;inset:0;background:#0006;z-index:20;align-items:center;justify-content:center;padding:24px}.modal.open{display:flex}.modal .card{max-width:420px}.modal-actions{display:grid;gap:10px;margin-top:20px}
@media(max-width:820px) and (orientation:portrait){.workspace{grid-template-columns:1fr;grid-template-rows:34% 66%}.screen{padding:16px}h1{font-size:38px}.topbar{flex-wrap:wrap}.timer{order:2;width:100%;text-align:right;height:0;transform:translateY(-34px);pointer-events:none}}
</style>
</head><body>
<section id="home" class="screen active"><div class="card"><div class="brand">Atelier Avon</div><h1>描こう。</h1><button class="primary" id="quickStart">30秒ドローイング</button><div class="grid"><button class="secondary" disabled>今日の練習（準備中）</button><button class="secondary" disabled>自由に描く（準備中）</button></div><div class="note">V0.2 — Apple Pencilで自然に描けることを検証する試作版です。</div></div></section>
<section id="setup" class="screen"><div class="card"><div class="brand">30秒ドローイング</div><h2>練習設定</h2><div class="grid"><div class="choice"><label for="duration">時間</label><select id="duration"><option value="30">30秒</option><option value="60">60秒</option><option value="120">2分</option><option value="300">5分</option></select></div><div class="choice"><label for="count">枚数</label><select id="count"><option value="5">5枚</option><option value="10" selected>10枚</option><option value="20">20枚</option></select></div><div class="choice"><label for="handedness">利き手</label><select id="handedness"><option value="right">右利き</option><option value="left">左利き</option></select></div></div><button class="primary" id="start">START</button><button class="secondary" id="backHome" style="margin-top:12px;width:100%">戻る</button></div></section>
<section id="session" class="right-handed"><div class="topbar"><div class="counter" id="counter"></div><button class="sessionbtn" id="pause">一時停止</button><button class="sessionbtn" id="skip">スキップ</button><button class="sessionbtn" id="abort">中断</button><button class="sessionbtn danger" id="clear">全消去</button><div class="timer" id="timer"></div></div><div class="workspace"><div class="reference" id="reference"></div><div class="drawpane" id="drawpane"><canvas id="canvas"></canvas><div class="toolbar"><button class="toolbtn on" id="pen">ペン</button><button class="toolbtn" id="eraser">消しゴム</button><button class="toolbtn" id="undo">Undo ↶</button><button class="toolbtn" id="redo">Redo ↷</button></div></div></div></section>
<section id="result" class="screen"><div class="card"><div class="brand">Session Complete</div><h2>今日のドローイング</h2><div id="summary"></div><div class="thumbs" id="thumbs"></div><div class="actions"><button class="primary" style="width:auto;flex:1" id="again">もう一度</button><button class="secondary" id="resultHome">ホームへ</button></div></div></section>
<div class="modal" id="abortModal" role="dialog" aria-modal="true"><div class="card"><h2>ここまでの練習を終了しますか？</h2><div class="modal-actions"><button class="primary" id="confirmAbort">終了する</button><button class="secondary" id="cancelAbort">練習に戻る</button></div></div></div>
<script>
const $=id=>document.getElementById(id),screens=['home','setup','session','result'];
const show=id=>screens.forEach(s=>$(s).classList.toggle('active',s===id));
const poses=[[[50,18],[50,31],[38,42],[24,52],[51,31],[65,42],[78,38],[50,31],[48,55],[38,78],[32,94],[48,55],[61,75],[70,93]],[[52,18],[51,31],[41,41],[29,31],[19,23],[51,31],[66,35],[77,50],[51,31],[53,55],[42,73],[31,91],[53,55],[67,70],[79,79]],[[49,17],[49,30],[35,37],[25,49],[18,60],[49,30],[63,36],[73,48],[81,55],[49,30],[48,55],[35,68],[22,74],[48,55],[58,74],[60,95]],[[50,17],[50,30],[38,39],[27,49],[20,42],[50,30],[62,39],[73,48],[80,41],[50,30],[50,55],[40,73],[37,94],[50,55],[62,73],[68,93]],[[50,18],[50,31],[38,38],[26,34],[15,29],[50,31],[63,38],[75,33],[87,28],[50,31],[50,55],[36,67],[25,82],[50,55],[64,68],[78,83]]];
function poseSvg(p){const l=(a,b)=>`<line x1="${p[a][0]}" y1="${p[a][1]}" x2="${p[b][0]}" y2="${p[b][1]}"/>`;return `<svg viewBox="0 0 100 110"><rect width="100" height="110" fill="#faf9f6"/><g stroke="#181818" stroke-width="4.2" stroke-linecap="round" fill="none"><circle cx="${p[0][0]}" cy="${p[0][1]}" r="7"/>${l(1,2)}${l(2,3)}${l(3,4)}${l(1,5)}${l(5,6)}${l(6,7)}${l(1,8)}${l(8,9)}${l(9,10)}${l(8,11)}${l(11,12)}</g></svg>`}
let duration=30,total=10,index=0,remaining=30,tick=null,paused=false,results=[];
const format=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
function renderPose(){$('reference').innerHTML=poseSvg(poses[index%poses.length]);$('counter').textContent=`${index+1} / ${total}`}
function updateTimer(){$('timer').textContent=format(remaining)}
function startTimer(){clearInterval(tick);paused=false;$('pause').textContent='一時停止';tick=setInterval(()=>{if(!paused&&--remaining<=0)nextPose();updateTimer()},1000)}
function saveCanvas(){results.push(canvas.toDataURL('image/png'))}
function nextPose(){if(drawing)return;saveCanvas();if(++index>=total)return finish();remaining=duration;resetDrawing();renderPose();updateTimer()}
function finish(){clearInterval(tick);if(index<total&&commands.length)saveCanvas();show('result');$('summary').textContent=`${results.length}枚 / 練習時間 ${format(duration*Math.max(0,index)+(duration-remaining))}`;$('thumbs').innerHTML=results.map(src=>`<div class="thumb"><img alt="練習結果" src="${src}"></div>`).join('')}
function begin(){duration=+$('duration').value;total=+$('count').value;index=0;remaining=duration;results=[];$('session').className=$('handedness').value==='left'?'left-handed':'right-handed';show('session');renderPose();resizeCanvas(false);resetDrawing();updateTimer();startTimer()}
function resetDrawing(){drawing=false;activePointer=null;lastPenAt=0;commands=[];redoStack=[];renderAll()}
$('quickStart').onclick=()=>show('setup');$('backHome').onclick=()=>show('home');$('start').onclick=begin;$('skip').onclick=nextPose;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'再開':'一時停止'};$('again').onclick=()=>{resetDrawing();show('setup')};$('resultHome').onclick=()=>show('home');
$('abort').onclick=()=>{$('abortModal').classList.add('open');paused=true;$('pause').textContent='再開'};$('cancelAbort').onclick=()=>{$('abortModal').classList.remove('open')};$('confirmAbort').onclick=()=>{$('abortModal').classList.remove('open');finish()};
const canvas=$('canvas'),ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});let commands=[],redoStack=[],drawing=false,activePointer=null,current=null,lastPenAt=0,mode='pen';
function resizeCanvas(preserve=true){const r=$('drawpane').getBoundingClientRect(),dpr=Math.max(1,devicePixelRatio||1);if(!r.width||!r.height)return;canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);renderAll()}
addEventListener('resize',()=>resizeCanvas());
function pressureWidth(p,type){if(mode==='eraser')return 26;const pressure=type==='pen'?Math.max(.04,p||.04):.45;return 1.1+Math.pow(pressure,.58)*7.2}
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,w:pressureWidth(e.pressure,e.pointerType)}}
function drawStroke(s){if(!s.points.length)return;ctx.save();ctx.globalCompositeOperation=s.mode==='eraser'?'destination-out':'source-over';ctx.strokeStyle='#111';ctx.lineCap='round';ctx.lineJoin='round';const p=s.points;if(p.length===1){ctx.beginPath();ctx.arc(p[0].x,p[0].y,p[0].w/2,0,Math.PI*2);ctx.fillStyle=s.mode==='eraser'?'rgba(0,0,0,1)':'#111';ctx.fill();ctx.restore();return}for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(a.x,a.y,mx,my);ctx.lineWidth=(a.w+b.w)/2;ctx.stroke()}ctx.restore()}
function renderAll(){const r=canvas.getBoundingClientRect();ctx.save();ctx.globalCompositeOperation='source-over';ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);ctx.restore();commands.forEach(drawStroke);if(current)drawStroke(current);updateHistoryButtons()}
function acceptPointer(e){if(e.pointerType==='pen'){lastPenAt=performance.now();return true}if(e.pointerType==='touch')return false;if(e.pointerType==='mouse')return e.button===0;return false}
canvas.addEventListener('pointerdown',e=>{if(!acceptPointer(e)||drawing)return;e.preventDefault();drawing=true;activePointer=e.pointerId;canvas.setPointerCapture(e.pointerId);current={mode,points:[point(e)]};renderAll()},{passive:false});
canvas.addEventListener('pointermove',e=>{if(!drawing||e.pointerId!==activePointer)return;e.preventDefault();const events=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of events)current.points.push(point(ev));renderAll()},{passive:false});
function endStroke(e,cancel=false){if(!drawing||e.pointerId!==activePointer)return;e.preventDefault();if(!cancel&&current){const events=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of events)current.points.push(point(ev));commands.push(current);redoStack=[]}drawing=false;activePointer=null;current=null;renderAll()}
canvas.addEventListener('pointerup',e=>endStroke(e),{passive:false});canvas.addEventListener('pointercancel',e=>endStroke(e,true),{passive:false});canvas.addEventListener('lostpointercapture',e=>{if(drawing&&e.pointerId===activePointer)endStroke(e)});
function updateHistoryButtons(){$('undo').disabled=!commands.length;$('redo').disabled=!redoStack.length}
$('pen').onclick=()=>setMode('pen');$('eraser').onclick=()=>setMode('eraser');function setMode(m){mode=m;$('pen').classList.toggle('on',m==='pen');$('eraser').classList.toggle('on',m==='eraser')}
$('undo').onclick=()=>{if(commands.length){redoStack.push(commands.pop());renderAll()}};$('redo').onclick=()=>{if(redoStack.length){commands.push(redoStack.pop());renderAll()}};$('clear').onclick=()=>{if(commands.length){commands.push({mode:'clear',points:[],before:commands.splice(0)});redoStack=[];renderAll()}};
// Clear commands store previous strokes as one undoable action.
const originalDrawStroke=drawStroke;drawStroke=function(s){if(s.mode!=='clear')originalDrawStroke(s)};
const originalUndo=$('undo').onclick;$('undo').onclick=()=>{if(!commands.length)return;const c=commands.pop();if(c.mode==='clear'){redoStack.push(c);commands.push(...c.before)}else redoStack.push(c);renderAll()};
const originalRedo=$('redo').onclick;$('redo').onclick=()=>{if(!redoStack.length)return;const c=redoStack.pop();if(c.mode==='clear'){c.before=commands.splice(0);commands.push(c)}else commands.push(c);renderAll()};
['selectstart','contextmenu','dragstart'].forEach(type=>$('session').addEventListener(type,e=>e.preventDefault()));document.addEventListener('gesturestart',e=>{if($('session').classList.contains('active'))e.preventDefault()},{passive:false});
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
