<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#f5f3ee" />
<link rel="manifest" href="manifest.webmanifest">
<title>Atelier Avon Draw v0.1</title>
<style>
:root{
  --bg:#f5f3ee; --panel:#fff; --ink:#181818; --muted:#777; --line:#ddd8ce; --accent:#181818;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,select{font:inherit}
button{cursor:pointer}
#home,#setup,#session,#result{display:none;height:100%}
.active{display:flex!important}
.screen{padding:28px;align-items:center;justify-content:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px;max-width:760px;width:100%;box-shadow:0 6px 24px rgba(0,0,0,.04)}
.brand{font-size:14px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
h1{font-size:46px;line-height:1.05;margin:10px 0 24px}
h2{font-size:30px;margin:0 0 22px}
.primary{background:var(--accent);color:#fff;border:none;border-radius:18px;padding:20px 24px;font-weight:700;font-size:22px;width:100%}
.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
.choice{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}
.choice label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}
.choice select{width:100%;border:0;background:transparent;font-weight:600}
.note{color:var(--muted);font-size:14px;line-height:1.6;margin-top:16px}
#session{flex-direction:column;padding:12px;gap:10px;overflow:hidden}
.topbar{height:54px;width:100%;display:flex;align-items:center;gap:10px}
.counter{font-weight:700;min-width:70px}
.timer{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;margin-left:auto}
.workspace{display:grid;grid-template-columns:minmax(280px,40%) minmax(0,60%);gap:10px;width:100%;flex:1;min-height:0}
.reference,.drawpane{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative}
.reference{display:flex;align-items:center;justify-content:center;padding:20px}
.reference svg{width:100%;height:100%;max-height:100%;object-fit:contain}
.drawpane{touch-action:none}
canvas{width:100%;height:100%;display:block;touch-action:none;background:#fff}
.toolbar{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;background:rgba(245,243,238,.92);backdrop-filter:blur(8px);padding:8px;border-radius:14px;border:1px solid var(--line)}
.toolbtn{border:0;background:#fff;border-radius:10px;padding:9px 12px;min-width:44px}
.toolbtn.on{background:#181818;color:#fff}
.sessionbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px}
#result .thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}
.thumb{aspect-ratio:1;background:#fafafa;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain}
.actions{display:flex;gap:10px;flex-wrap:wrap}
@media(max-width:820px) and (orientation:portrait){
  .workspace{grid-template-columns:1fr;grid-template-rows:35% 65%}
  .screen{padding:16px}
  h1{font-size:38px}
}
</style>
</head>
<body>

<section id="home" class="screen active">
  <div class="card">
    <div class="brand">Atelier Avon</div>
    <h1>描こう。</h1>
    <button class="primary" id="quickStart">30秒ドローイング</button>
    <div class="grid">
      <button class="secondary" disabled>今日の練習（準備中）</button>
      <button class="secondary" disabled>自由に描く（準備中）</button>
    </div>
    <div class="note">V0.1 — まずは「起動してすぐ描ける」ことだけを試すプロトタイプです。</div>
  </div>
</section>

<section id="setup" class="screen">
  <div class="card">
    <div class="brand">30秒ドローイング</div>
    <h2>練習設定</h2>
    <div class="grid">
      <div class="choice"><label>時間</label>
        <select id="duration"><option value="30">30秒</option><option value="60">60秒</option><option value="120">2分</option><option value="300">5分</option></select>
      </div>
      <div class="choice"><label>枚数</label>
        <select id="count"><option value="5">5枚</option><option value="10" selected>10枚</option><option value="20">20枚</option></select>
      </div>
    </div>
    <button class="primary" id="start">START</button>
    <button class="secondary" id="backHome" style="margin-top:12px;width:100%">戻る</button>
    <div class="note">人物ポーズ素材は、この試作版用に作った簡易シルエットです。</div>
  </div>
</section>

<section id="session">
  <div class="topbar">
    <div class="counter" id="counter">1 / 10</div>
    <button class="sessionbtn" id="pause">一時停止</button>
    <button class="sessionbtn" id="skip">スキップ</button>
    <div class="timer" id="timer">00:30</div>
  </div>
  <div class="workspace">
    <div class="reference" id="reference"></div>
    <div class="drawpane" id="drawpane">
      <canvas id="canvas"></canvas>
      <div class="toolbar">
        <button class="toolbtn on" id="pen">ペン</button>
        <button class="toolbtn" id="eraser">消し</button>
        <button class="toolbtn" id="undo">↶</button>
        <button class="toolbtn" id="clear">消去</button>
      </div>
    </div>
  </div>
</section>

<section id="result" class="screen">
  <div class="card">
    <div class="brand">Session Complete</div>
    <h2>今日のドローイング</h2>
    <div id="summary"></div>
    <div class="thumbs" id="thumbs"></div>
    <div class="actions">
      <button class="primary" style="width:auto;flex:1" id="again">もう一度</button>
      <button class="secondary" id="resultHome">ホームへ</button>
    </div>
    <div class="note">AI添削・履歴・写真資料は次の段階で追加できます。</div>
  </div>
</section>

<script>
const $=id=>document.getElementById(id);
const screens=['home','setup','session','result'];
function show(id){screens.forEach(s=>$(s).classList.toggle('active',s===id));}

const poses = [
  [[50,18],[50,31],[38,42],[24,52],[51,31],[65,42],[78,38],[50,31],[48,55],[38,78],[32,94],[48,55],[61,75],[70,93]],
  [[52,18],[51,31],[41,41],[29,31],[19,23],[51,31],[66,35],[77,50],[51,31],[53,55],[42,73],[31,91],[53,55],[67,70],[79,79]],
  [[49,17],[49,30],[35,37],[25,49],[18,60],[49,30],[63,36],[73,48],[81,55],[49,30],[48,55],[35,68],[22,74],[48,55],[58,74],[60,95]],
  [[50,17],[50,30],[38,39],[27,49],[20,42],[50,30],[62,39],[73,48],[80,41],[50,30],[50,55],[40,73],[37,94],[50,55],[62,73],[68,93]],
  [[50,18],[50,31],[38,38],[26,34],[15,29],[50,31],[63,38],[75,33],[87,28],[50,31],[50,55],[36,67],[25,82],[50,55],[64,68],[78,83]],
  [[51,18],[50,31],[39,40],[31,54],[25,67],[50,31],[61,41],[72,55],[78,68],[50,31],[49,55],[34,61],[23,73],[49,55],[62,61],[74,71]],
  [[49,17],[49,30],[36,36],[24,31],[15,22],[49,30],[63,34],[75,43],[84,51],[49,30],[51,54],[40,72],[28,88],[51,54],[66,66],[82,70]],
  [[50,18],[50,31],[39,39],[31,52],[21,59],[50,31],[61,39],[69,52],[80,59],[50,31],[49,55],[39,73],[28,93],[49,55],[59,73],[70,93]],
  [[52,18],[51,31],[39,42],[26,44],[16,39],[51,31],[64,36],[77,29],[84,19],[51,31],[53,55],[42,66],[31,77],[53,55],[68,61],[82,57]],
  [[48,17],[49,30],[37,38],[25,48],[16,57],[49,30],[62,38],[71,50],[79,62],[49,30],[50,54],[38,60],[27,70],[50,54],[62,65],[72,78]]
];
function poseSvg(points){
  const p=points, line=(a,b)=>`<line x1="${p[a][0]}" y1="${p[a][1]}" x2="${p[b][0]}" y2="${p[b][1]}" />`;
  return `<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="110" fill="#faf9f6"/>
  <g stroke="#181818" stroke-width="4.2" stroke-linecap="round" fill="none">
    <circle cx="${p[0][0]}" cy="${p[0][1]}" r="7"/>
    ${line(1,2)}${line(2,3)}${line(3,4)}
    ${line(1,5)}${line(5,6)}${line(6,7)}
    ${line(1,8)}
    ${line(8,9)}${line(9,10)}
    ${line(8,11)}${line(11,12)}
  </g></svg>`;
}

let duration=30,total=10,index=0,remaining=30,tick=null,paused=false,results=[];
function renderPose(){ $('reference').innerHTML=poseSvg(poses[index%poses.length]); $('counter').textContent=`${index+1} / ${total}`; }
function format(sec){return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function updateTimer(){ $('timer').textContent=format(remaining); }
function startTimer(){
  clearInterval(tick); paused=false; $('pause').textContent='一時停止';
  tick=setInterval(()=>{ if(paused)return; remaining--; updateTimer(); if(remaining<=0) nextPose(); },1000);
}
function saveCanvas(){ results.push(canvas.toDataURL('image/png')); }
function nextPose(){
  saveCanvas(); index++;
  if(index>=total){finish(); return;}
  remaining=duration; updateTimer(); clearCanvas(); undoStack=[]; renderPose();
}
function finish(){
  clearInterval(tick); show('result');
  $('summary').textContent=`${total}枚 / 合計 ${format(duration*total)}`;
  $('thumbs').innerHTML=results.map(src=>`<div class="thumb"><img src="${src}"></div>`).join('');
}
function begin(){
  duration=Number($('duration').value); total=Number($('count').value);
  index=0; remaining=duration; results=[]; undoStack=[];
  show('session'); renderPose(); resizeCanvas(); clearCanvas(); updateTimer(); startTimer();
}

$('quickStart').onclick=()=>show('setup'); $('backHome').onclick=()=>show('home'); $('start').onclick=begin;
$('skip').onclick=nextPose;
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'再開':'一時停止'};
$('again').onclick=()=>show('setup'); $('resultHome').onclick=()=>show('home');

const canvas=$('canvas'),ctx=canvas.getContext('2d',{desynchronized:true});
let drawing=false,mode='pen',last=null,undoStack=[];
function resizeCanvas(){
  const r=$('drawpane').getBoundingClientRect(), dpr=Math.max(1,window.devicePixelRatio||1);
  const old=canvas.width?canvas.toDataURL():null;
  canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
  canvas.style.width=r.width+'px'; canvas.style.height=r.height+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineCap='round';ctx.lineJoin='round';
  if(old){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=old}
}
window.addEventListener('resize',resizeCanvas);
function clearCanvas(){const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height)}
function snapshot(){if(undoStack.length>20)undoStack.shift();undoStack.push(canvas.toDataURL())}
function pos(e){const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault(); canvas.setPointerCapture(e.pointerId); snapshot(); drawing=true; last=pos(e);
});
canvas.addEventListener('pointermove',e=>{
  if(!drawing)return;e.preventDefault();const q=pos(e);
  const pressure=(e.pressure&&e.pointerType==='pen')?e.pressure:.5;
  ctx.globalCompositeOperation=mode==='eraser'?'destination-out':'source-over';
  ctx.strokeStyle='#111';ctx.lineWidth=mode==='eraser'?24:(1.4+pressure*3.2);
  ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(q.x,q.y);ctx.stroke();last=q;
});
function end(e){drawing=false;last=null}
canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
$('pen').onclick=()=>{mode='pen';$('pen').classList.add('on');$('eraser').classList.remove('on')};
$('eraser').onclick=()=>{mode='eraser';$('eraser').classList.add('on');$('pen').classList.remove('on')};
$('clear').onclick=()=>{snapshot();clearCanvas()};
$('undo').onclick=()=>{
  const src=undoStack.pop(); if(!src)return; const im=new Image(); im.onload=()=>{clearCanvas();const r=canvas.getBoundingClientRect();ctx.drawImage(im,0,0,r.width,r.height)}; im.src=src;
};

if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script>
</body>
</html>
